# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test Static Files

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: NovelWriter integrate smoke
        timeout-minutes: 5
        run: npm run test:smoke:nw-integrate

      - name: NovelWriter retention smoke
        timeout-minutes: 5
        run: npm run test:smoke:nw-retention

      - name: "CI guard: XAI smoke dispatch-only"
        run: npm run test:ci:xai-guard

      - name: NovelWriter S1 migration smoke
        timeout-minutes: 5
        run: npm run test:smoke:nw-migration

      - name: NovelWriter S1 Setup lock smoke (LOCK:setup-midrun, LOCK:pause-held)
        timeout-minutes: 5
        run: npm run test:smoke:nw-setup-lock

      - name: NovelWriter S1 pinned-fixture smoke
        timeout-minutes: 5
        run: npm run test:smoke:nw-s1-pin

      - name: NovelWriter QCAT harness smoke (QH:23 REQ-SCH-07)
        timeout-minutes: 5
        run: npm run test:smoke:nw-qcat-harness

      - name: Story Core 2.0 contract smoke
        timeout-minutes: 5
        run: npm run test:contract:story-core

      - name: NovelWriter Q1-Q3 trust smoke
        timeout-minutes: 5
        run: npm run test:smoke:nw-trust-q1q3

      - name: NovelWriter 4p writing-plans smoke
        timeout-minutes: 5
        run: npm run test:smoke:nw-writing-plans

      - name: NovelWriter 167 gates smoke
        timeout-minutes: 5
        run: npm run smoke:nw-167

      - name: Lint HTML files
        run: |
          npx htmlhint "**/*.html"

      - name: Check for console.log statements
        run: |
          if grep -r "console\.log" --include="*.js" --include="*.html" --exclude-dir=node_modules --exclude-dir="playwright-report*" .; then
            echo "WARNING: Found console.log statements that should be removed for production"
          else
            echo "OK: No console.log statements found"
          fi

      - name: Validate JSON files
        run: |
          for file in $(find . -name "*.json" -not -path "./node_modules/*"); do
            if ! jq empty "$file" 2>/dev/null; then
              echo "ERROR: Invalid JSON: $file"
              exit 1
            fi
          done
          echo "OK: All JSON files are valid"

      - name: Grok endpoint smoke test
        if: github.event_name == 'workflow_dispatch'
        env:
          XAI_API_KEY: '${{ secrets.XAI_API_KEY }}'
          XAI_SMOKE_MODEL: '${{ vars.XAI_SMOKE_MODEL }}'
        run: |
          set -euo pipefail
          if [ -z "${XAI_API_KEY:-}" ]; then
            echo "INFO: XAI_API_KEY is not available in this run context; skipping endpoint smoke test"
            exit 0
          fi
          if [ -z "${XAI_SMOKE_MODEL:-}" ]; then
            echo "INFO: repo variable XAI_SMOKE_MODEL is not set; skipping endpoint smoke test"
            exit 0
          fi

          payload=$(jq -n --arg model "$XAI_SMOKE_MODEL" '{model: $model, messages: [{role: "user", content: "Reply with the single token: ok"}], max_tokens: 8, temperature: 0}')
          response=$(curl -sS https://api.x.ai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${XAI_API_KEY}" \
            -d "$payload")

          if ! echo "$response" | jq -e '.choices[0].message.content' >/dev/null; then
            echo "ERROR: Grok endpoint returned an unexpected response shape"
            echo "$response" | jq -c '{error, id, model}' || true
            exit 1
          fi

          echo "OK: Grok endpoint smoke test passed"

      - name: Check file sizes
        run: |
          echo "File sizes:"
          find . -name "*.html" -o -name "*.js" -o -name "*.css" | xargs ls -lh | head -20
